<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Default SEO tags below cover the home page. Each route also sets its
      own title/description at runtime via <SEO> (src/components/SEO.jsx),
      but keep these defaults accurate since they're what shows up before
      the app finishes loading and in any tool that doesn't run JS.
    -->
    <title>Centroid 3D Tours | St. Louis 3D Tours &amp; Landlord Property Documentation</title>
    <meta
      name="description"
      content="St. Louis 3D property tours and dated condition documentation for landlords — listing-ready tours plus insurance and dispute protection. Flat fee by bedroom count, no subscriptions."
    />
    <meta
      name="keywords"
      content="St. Louis 3D tours, St. Louis landlord property documentation, rental property tours St. Louis"
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Centroid 3D Tours | St. Louis 3D Tours & Landlord Property Documentation" />
    <meta
      property="og:description"
      content="360° property tours and dated condition documentation for St. Louis landlords. Flat fee by bedroom count, no subscriptions."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-paper text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
